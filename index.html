<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dla Vanessy ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #e6e6fa 100%);
            min-height: 100dvh; /* Nowoczesne rozwiązanie dla telefonów */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
            position: relative;
        }

        .music-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #ff6b81;
            color: #ff6b81;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 107, 129, 0.35);
            font-size: 24px;
            pointer-events: none;
            z-index: 0;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            100% { transform: translateY(-110dvh) rotate(360deg) scale(1.4); opacity: 0; }
        }

        .card {
            background: rgba(255, 255, 255, 0.94);
            border-radius: 28px;
            padding: 25px 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .hidden { display: none !important; }

        .img-container {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
            background: #ffe6ea;
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        .btn-option {
            background: #fff;
            border: 2px solid #ffd1dc;
            padding: 12px;
            margin: 5px 0;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }

        .next-btn, .kiss-btn {
            background: #ff6b81;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .progress-bar-container { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-bottom: 10px; }
        .progress-bar { height: 100%; background: #ff6b81; width: 0%; border-radius: 4px; transition: width 0.3s; }
        
        .letter-box { background: #fff0f3; padding: 15px; border-radius: 15px; text-align: left; margin-top: 10px; }
    </style>
</head>
<body>

<audio id="bg-music" loop>
    <source src="careless_whisper.mp3" type="audio/mpeg">
</audio>

<button class="music-toggle" onclick="toggleMusic()">🎵 <span id="m-text">Muzyka</span></button>

<div id="hearts-container"></div>

<div class="card" id="main-card">
    <!-- Ekrany (Start, Quiz, End) -->
    <div id="start-screen">
        <h1>Wszystkiego najlepszego kotek ❤️</h1>
        <div class="img-container"><img src="4e5e3b74-0920-4948-a4cc-162cd3a98756.jpg"></div>
        <button class="next-btn" onclick="startQuiz()">Zaczynamy!</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>
        <h1 id="question-title"></h1>
        <div class="img-container"><img id="question-img" src=""></div>
        <div id="options-container"></div>
        <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">Dalej</button>
    </div>

    <div id="end-screen" class="hidden">
        <h1>Brawo! 💕</h1>
        <div id="relationship-timer" style="font-weight:bold; color:#ff6b81; margin:10px 0;"></div>
        <div class="img-container"><img src="247602a4-804a-4899-99f4-9697f4103767.jpg"></div>
        <div id="envelope-container" onclick="openLetter()" class="next-btn">✉️ Otwórz list!</div>
        <div id="letter-placeholder" class="letter-box hidden">
            Koteczek mój, <br>Wszystkiego najlepszego... <br>
            <button class="kiss-btn" onclick="sendKiss()">Wyślij buziaka Misiowi! 💋</button>
            <div id="kiss-msg" class="hidden" style="margin-top:10px; color:#ff4757;">Buziak wysłany! 😘</div>
        </div>
    </div>
</div>

<script>
    const music = document.getElementById('bg-music');
    let isPlaying = false;

    function toggleMusic() {
        if (isPlaying) {
            music.pause();
            document.getElementById('m-text').innerText = "Włącz";
            isPlaying = false;
        } else {
            // Próba odtworzenia - jeśli pliku nie ma, wyrzuci błąd w konsoli (F12)
            music.play().catch(e => {
                alert("Nie mogę odtworzyć muzyki. Sprawdź, czy plik 'careless_whisper.mp3' jest w folderze!");
                console.error(e);
            });
            document.getElementById('m-text').innerText = "Pauza";
            isPlaying = true;
        }
    }

    // Funkcje Quizu i reszta (zostają te same co poprzednio)
    // ... [reszta kodu JavaScript] ...
    
    // (Dopisz resztę logiki quizu z poprzedniego kodu tutaj)
</script>

</body>
</html>
