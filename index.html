<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dla Vanessy ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #e6e6fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            font-family: 'Fredoka One', cursive;
            color: #ff6b81;
            font-size: 26px;
            margin-bottom: 15px;
            line-height: 1.2;
        }
        p.subtitle {
            color: #555;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .btn-option {
            background: #ffffff;
            border: 2px solid #ffd1dc;
            color: #444;
            padding: 14px 18px;
            margin: 10px 0;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-option:active {
            transform: scale(0.98);
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
            min-height: 24px;
        }
        .correct { color: #2ed573; }
        .wrong { color: #ff4757; }
        .hidden { display: none; }
        .next-btn {
            background: #ff6b81;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
            font-size: 15px;
        }
        .letter-box {
            background: #fff0f3;
            border: 1px dashed #ff6b81;
            border-radius: 16px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
            color: #444;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- EKRAN STARTOWY -->
    <div id="start-screen">
        <h1>Wszystkiego najlepszego kotek ❤️</h1>
        <p class="subtitle">Zrobiłem dla ciebie krótki quiz zobaczymy jak ci pójdzie</p>
        <button class="next-btn" onclick="startQuiz()">Zaczynamy! ➔</button>
    </div>

    <!-- EKRAN QUIZU -->
    <div id="quiz-screen" class="hidden">
        <h1 id="question-title">Pytanie</h1>
        <div id="options-container"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">Dalej ➔</button>
    </div>

    <!-- EKRAN KOŃCOWY -->
    <div id="end-screen" class="hidden">
        <h1>Brawo Kotek! 💕</h1>
        <p class="subtitle">Pamiętasz wszystko idealnie!</p>
        <div id="letter-placeholder" class="letter-box">
            <p><i>[Miejsce na Twój list - dokleimy go tutaj, jak tylko mi go napiszesz!]</i></p>
        </div>
    </div>
</div>

<script>
    const questions = [
        {
            title: "Pamiętasz nasz inside joke z pierwszej randki?",
            options: ["Freddy", "Śpuścizna", "Domynyk"],
            correctIndex: 1,
            correctText: "Dokładnie tak! 😂❤️",
            wrongText: "Oj nie... spróbuj jeszcze raz! 😉"
        },
        {
            title: "Myślisz że co najbardziej w tobie kocham?",
            options: ["Oczy", "Charakter", "Całaaa ciebie"],
            correctIndex: 2,
            correctText: "Pewnie, że całą Ciebie! 💕",
            wrongText: "Blisko, ale pomyśl o wszystkim w pakiecie!"
        }
    ];

    let currentQ = 0;

    function startQuiz() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const q = questions[currentQ];
        document.getElementById('question-title').innerText = q.title;
        document.getElementById('feedback').innerText = '';
        document.getElementById('next-btn').classList.add('hidden');

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx);
            container.appendChild(btn);
        });
    }

    function checkAnswer(idx) {
        const q = questions[currentQ];
        const feedback = document.getElementById('feedback');
        
        if (idx === q.correctIndex) {
            feedback.innerText = q.correctText;
            feedback.className = 'feedback correct';
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            feedback.innerText = q.wrongText;
            feedback.className = 'feedback wrong';
        }
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
        }
    }
</script>

</body>
</html>
